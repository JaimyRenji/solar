name: solar-system

on:
  workflow_dispatch:
  push:
    branches:
      - main    
env:
  DOCKER_REPO_NAME: solar-app

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: 'mongodb://localhost:27017/superData'
      MONGO_USERNAME: "non-prod-user"
      MONGO_PASSWORD: "non-prod-password"
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017
    steps:
      - name: Checkout stage
        uses: actions/checkout@v4

      - name: Setting up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: caching dependencies
        uses: actions/cache@v6
        id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      # added some some dependency and see cache invalidated
      - name: Installing dependencies
        run: npm install
        if: steps.npm-cache.outputs.cache-hit != 'true'

      - name: Testing the Node app
        run: npm test

      - name: Installing coverage report
        run: npm run coverage
        continue-on-error: true

      - name: Archive test report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-result
          path: coverage
          retention-days: 5
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{vars.DOCKER_USERNAME}}/${{env.DOCKER_REPO_NAME}}:${{github.run_number}}
  
  deploy-production:
    name: Pretend Production Deployment
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:

      - name: Pretend deployment
        run: |
          echo "======================================"
          echo "      PRODUCTION DEPLOYMENT"
          echo "======================================"
          echo "Image tag: ${{ github.sha }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deployment approved!"
          echo "Pretending to deploy to production..."
          echo "Deployment successful!"